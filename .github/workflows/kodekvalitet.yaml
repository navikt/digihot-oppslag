name: Kodekvalitet

on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENCE"
      - "CODEOWNERS"
    branches:
      - main

jobs:
  build:
    name: Scan kode for svakheter
    permissions:
      actions: read
      contents: write
      security-events: write
    secrets: inherit
    uses: navikt/hm-workflows/.github/workflows/kodekvalitet.yaml@main
    with:
      java-version: '25'
